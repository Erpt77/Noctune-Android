name: Android CI

on:
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "database/**"
      - "designsystem/**"
      - "flaccore/**"
      - "spotifycore/**"
      - "lastfm/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "core/**"
      - "database/**"
      - "designsystem/**"
      - "flaccore/**"
      - "spotifycore/**"
      - "lastfm/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Unit tests and Android release compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and compile the GMS ARM64 release
        run: ./gradlew --no-daemon testGmsMobileArm64ReleaseUnitTest assembleGmsMobileArm64Release
